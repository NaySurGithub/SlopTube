name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NDK_VERSION: 27.2.12479018
  CLANG_FORMAT_VERSION: 23.1.3

jobs:
  format:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install clang-format
        run: pipx install "clang-format==${CLANG_FORMAT_VERSION}"
      - name: Check formatting
        run: |
          find src tools -name '*.cpp' -o -name '*.hpp' -o -name '*.h' \
            | xargs clang-format --dry-run --Werror

  cli:
    name: CLI (macOS)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Ninja
        run: brew install ninja
      - name: Cache dependencies
        uses: actions/cache@v4
        with:
          path: build/host-debug/_deps
          key: host-deps-${{ hashFiles('cmake/Dependencies.cmake') }}
      - name: Configure
        run: cmake --preset host-debug
      - name: Build
        run: cmake --build --preset host-debug

  android:
    name: Android APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Install Ninja
        run: sudo apt-get install -y ninja-build
      - name: Install SDK packages
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "platforms;android-35" "build-tools;35.0.0" "ndk;${NDK_VERSION}"
      - name: Cache dependencies
        uses: actions/cache@v4
        with:
          path: build/android-release/_deps
          key: android-deps-${{ hashFiles('cmake/Dependencies.cmake') }}
      - name: Configure
        run: cmake --preset android-release -DSLOPTUBE_ANDROID_NDK="$ANDROID_HOME/ndk/${NDK_VERSION}"
      - name: Build APK
        run: cmake --build --preset android-release
      - uses: actions/upload-artifact@v4
        with:
          name: SlopTube-${{ github.sha }}
          path: build/android-release/SlopTube.apk
          if-no-files-found: error
