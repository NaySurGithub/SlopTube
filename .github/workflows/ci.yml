name: CI

# A pushed "v*" tag also signs the APK with the release key and publishes it (see
# docs/releasing.md).
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NDK_VERSION: 27.2.12479018
  CLANG_FORMAT_VERSION: 23.1.3

jobs:
  format:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install clang-format
        run: pipx install "clang-format==${CLANG_FORMAT_VERSION}"
      - name: Check formatting
        run: |
          find src tools -name '*.cpp' -o -name '*.hpp' -o -name '*.h' \
            | xargs clang-format --dry-run --Werror

  cli:
    name: CLI (macOS)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Ninja
        run: brew install ninja
      - name: Cache dependencies
        uses: actions/cache@v4
        with:
          path: build/host-debug/_deps
          key: host-deps-${{ hashFiles('cmake/Dependencies.cmake') }}
      - name: Configure
        run: cmake --preset host-debug
      - name: Build
        run: cmake --build --preset host-debug

  android:
    name: Android APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Install Ninja
        run: sudo apt-get install -y ninja-build
      - name: Install SDK packages
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "platforms;android-35" "build-tools;35.0.0" "ndk;${NDK_VERSION}"
      - name: Cache dependencies
        uses: actions/cache@v4
        with:
          path: build/android-release/_deps
          key: android-deps-${{ hashFiles('cmake/Dependencies.cmake') }}
      - name: Check the tag against the project version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          version=$(sed -nE 's/^ *VERSION ([0-9]+\.[0-9]+\.[0-9]+)$/\1/p' CMakeLists.txt)
          if [ "v${version}" != "${GITHUB_REF_NAME}" ]; then
            echo "::error::Tag ${GITHUB_REF_NAME} does not match the project version ${version}"
            exit 1
          fi
      - name: Install the release key
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          KEYSTORE_BASE64: ${{ secrets.SLOPTUBE_KEYSTORE_BASE64 }}
        run: |
          if [ -z "${KEYSTORE_BASE64}" ]; then
            echo "::error::The SLOPTUBE_KEYSTORE_BASE64 secret is missing (see docs/releasing.md)"
            exit 1
          fi
          echo "${KEYSTORE_BASE64}" | base64 --decode > "${RUNNER_TEMP}/release.keystore"
          echo "SIGNING=-DSLOPTUBE_KEYSTORE=${RUNNER_TEMP}/release.keystore -DSLOPTUBE_KEYSTORE_PASS=env:SLOPTUBE_KEYSTORE_PASSWORD -DSLOPTUBE_UPDATES=ON" >> "$GITHUB_ENV"
      - name: Configure
        run: cmake --preset android-release -DSLOPTUBE_ANDROID_NDK="$ANDROID_HOME/ndk/${NDK_VERSION}" ${SIGNING}
      - name: Build APK
        env:
          SLOPTUBE_KEYSTORE_PASSWORD: ${{ secrets.SLOPTUBE_KEYSTORE_PASSWORD }}
        run: cmake --build --preset android-release
      - name: Remove the release key
        if: always() && startsWith(github.ref, 'refs/tags/v')
        run: rm -f "${RUNNER_TEMP}/release.keystore"
      - uses: actions/upload-artifact@v4
        with:
          name: SlopTube-${{ github.sha }}
          path: build/android-release/SlopTube.apk
          if-no-files-found: error

  release:
    name: Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [format, cli, android]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: SlopTube-${{ github.sha }}
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          apk="SlopTube-${GITHUB_REF_NAME}.apk"
          mv SlopTube.apk "${apk}"
          sha256sum "${apk}" > "${apk}.sha256"
          gh release create "${GITHUB_REF_NAME}" "${apk}" "${apk}.sha256" \
            --repo "${GITHUB_REPOSITORY}" --title "SlopTube ${GITHUB_REF_NAME#v}" \
            --generate-notes --verify-tag
