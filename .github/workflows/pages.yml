name: Pages

# The project site (site/, the docs rendered from docs/) on GitHub Pages; see docs/site.md.
on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - "docs/**"
      - "tools/site/**"
      - "android/logo.svg"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

env:
  MARKDOWN_VERSION: "3.7"

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Markdown
        run: pip install "markdown==${MARKDOWN_VERSION}"
      - name: Build the site
        run: python3 tools/site/build.py _site
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    name: Deploy
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
